theme = "flexoki dark"
client_id_command = { command = "bash", args = ["-c", "cat $XDG_CACHE_HOME/spotify_client_id"] }
client_port = 8080
login_redirect_uri = "http://127.0.0.1:8989/login"

playback_format = """
{status} {track} • {artists}
{album}
{genres}
{metadata}"""
playback_metadata_fields = [
    "repeat",
    "shuffle",
    "volume",
]

tracks_playback_limit = 50
app_refresh_duration_in_ms = 32
playback_refresh_duration_in_ms = 0
page_size_in_rows = 20

play_icon = "|>"
pause_icon = "||"
liked_icon = "<3"
explicit_icon = "(E)"

border_type = "Hidden"
progress_bar_type = "Line"
progress_bar_position = "Bottom"

genre_num = 3
cover_img_length = 0
cover_img_width = 5
enable_media_control = true
enable_streaming = "Always"
enable_audio_visualization = false
enable_notify = true
enable_cover_image_cache = true
notify_streaming_only = false
seek_duration_secs = 5
sort_artist_albums_by_type = false
volume_scroll_step = 5
enable_mouse_scroll_volume = true
custom_queue = true
enable_relative_line_number = false
pause_on_startup = true

[notify_format]
summary = "{track} • {artists}"
body = "{album}"

[layout]
playback_window_position = "Top"
playback_window_height = 4

[layout.library]
playlist_percent = 40
album_percent = 40

[device]
name = "osmium (spotify-player)"
device_type = "computer"
volume = 100
bitrate = 320
audio_cache = true
normalization = true
autoplay = true

[main]
font = Geist:pixelsize=24
prompt = ""
placeholder = "Applications"
icons-enabled = yes
anchor=center
x-margin=12
y-margin=12
lines=9
width=36
horizontal-pad=12
vertical-pad=12
inner-pad=12
filter-desktop=yes
terminal="footclient -a '{cmd}' -T '{cmd}' {cmd}"

[colors]

music_directory	"$XDG_MUSIC_DIR"
playlist_directory "$XDG_CONFIG_HOME/mpd/playlists"

db_file "$XDG_CACHE_HOME/mpd/database"
state_file "$HOME/.local/state/mpd/state"
sticker_file "$XDG_CACHE_HOME/mpd/sticker.sql"
log_file "syslog"

bind_to_address "/run/user/1000/mpd/socket"

restore_paused "yes"
auto_update	"yes"

audio_output {
	type "pipewire"
    name "PipeWire Sound Server"
}

audio_output {
    type "fifo"
    name "visualizer"
    path "/tmp/mpd.fifo"
    format "44100:16:2"
}

replaygain "track"
